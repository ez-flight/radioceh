{% extends "base.html" %}
{% block title %}Вход — Радиоцех{% endblock %}
{% block content %}
<section class="section">
  <article class="form-card" style="max-width:460px;margin:24px auto">
    <h1>Вход</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Войти</button>
    </form>
    <p><a href="{% url 'register' %}">Создать аккаунт</a></p>
  </article>
</section>
{% endblock %}
